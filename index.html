<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <title>Mi pantalla</title>
  <link rel="preload" href="assets/wallpaper.svg" as="image">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="apps-manager.css">
  <link rel="stylesheet" href="lights-panel.css">
</head>
<body>
  <div class="stage">
    <div class="wallpaper" aria-hidden="true">
      <img class="wallpaper-layer" alt="" draggable="false">
      <img class="wallpaper-layer" alt="" draggable="false">
    </div>
    <div class="aura" aria-hidden="true"></div>
    <div class="aura" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <div class="identity">
          <svg class="identity-mark" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="mark-fill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9fe7ff"/>
                <stop offset=".55" stop-color="#4f6bff"/>
                <stop offset="1" stop-color="#ff7a59"/>
              </linearGradient>
            </defs>
            <rect x="2" y="5" width="28" height="20" rx="7" fill="url(#mark-fill)"/>
            <rect x="2.75" y="5.75" width="26.5" height="18.5" rx="6.25" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
            <path d="M8 11.5c2.5-2 6-2.6 9-1.8" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>
            <rect x="11" y="27" width="10" height="2" rx="1" fill="#fff" fill-opacity=".6"/>
          </svg>
          <span class="identity-name">Mi pantalla</span>
          <span class="preview-label" hidden>Vista previa local</span>
        </div>
        <div class="top-actions">
          <button id="lights-button" class="glass glass-pill edit-button lights-button" type="button" aria-label="Luces del living" hidden>
            <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a6.5 6.5 0 0 0-3.8 11.8c.6.4.8 1 .8 1.7V17h6v-.5c0-.7.2-1.3.8-1.7A6.5 6.5 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9.5 20.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="edit-label">Luces</span>
          </button>
          <button id="edit-button" class="glass glass-pill edit-button" type="button" aria-label="Personalizar">
            <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="15" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="9" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="edit-label">Personalizar</span>
          </button>
          <div id="weather" class="glass glass-pill weather" role="group" aria-label="Consultando el clima" data-state="loading">
            <svg class="weather-icon" viewBox="0 0 48 48" aria-hidden="true"><use xlink:href="#wx-unknown"/></svg>
            <span class="weather-temp" aria-hidden="true">–</span>
            <span class="weather-text" aria-hidden="true">
              <span class="weather-condition">Clima</span>
              <span class="weather-meta">Consultando…</span>
            </span>
          </div>
          <div class="glass glass-pill clock">
            <time id="clock" aria-label="Hora local"></time>
            <span id="date"></span>
          </div>
        </div>
      </header>

      <main class="home">
        <section class="dock glass" aria-label="Tus aplicaciones y entradas">
          <div class="dock-frost" aria-hidden="true">
            <canvas class="frost-layer"></canvas>
            <canvas class="frost-layer"></canvas>
          </div>
          <div class="dock-apps">
            <h2 id="apps-heading" class="sr-only">Tus aplicaciones</h2>
            <div id="apps-grid" class="tiles-row" aria-labelledby="apps-heading"></div>
            <p id="empty-state" class="empty-state" hidden>
              No hay apps visibles. Elegí cuáles mostrar en Personalizar.
            </p>
          </div>
          <span class="dock-divider" aria-hidden="true"></span>
          <div class="dock-inputs">
            <h2 id="inputs-heading" class="sr-only">Entradas</h2>
            <div id="inputs-grid" class="tiles-row" aria-labelledby="inputs-heading"></div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-info">
          <p id="status" role="status" aria-live="polite"></p>
          <p id="photo-credit" class="photo-credit" hidden></p>
        </div>
        <div class="navigation-hint" aria-hidden="true">
          <span class="hint">
            <svg class="key key-icon" viewBox="0 0 24 24">
              <path d="M12 4l2.6 3H9.4zM12 20l-2.6-3h5.2zM4 12l3-2.6v5.2zM20 12l-3 2.6V9.4z" fill="currentColor"/>
              <circle cx="12" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            </svg>Moverse
          </span>
          <span class="hint"><span class="key">OK</span>Abrir</span>
          <span class="hint">
            <svg class="key key-icon" viewBox="0 0 24 24">
              <path d="M9.5 7L5 11.5 9.5 16M5.5 11.5H14a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(1 -2)"/>
            </svg>Volver
          </span>
        </div>
      </footer>
    </div>

    <div class="scrim" aria-hidden="true"></div>
    <section id="manage-panel" class="manage-panel glass" role="dialog" aria-modal="true" aria-labelledby="manage-title" hidden>
      <p class="panel-kicker">Personalizar</p>
      <h2 id="manage-title">Apps y orden</h2>
      <p class="manage-description">Ocultar una app acá no la desinstala de la tele.</p>
      <div id="manage-list" class="manage-list"></div>
      <div id="sources-view" class="sources-view" hidden></div>
      <div class="manage-actions">
        <button id="reset-button" class="ghost-button" type="button">Restablecer selección</button>
        <button id="sources-button" class="ghost-button" type="button">Fuentes</button>
        <button id="done-button" class="primary-button" type="button">Listo</button>
      </div>
    </section>
    <!-- Luces WiZ: lights-panel.js completa la lista y los controles; queda oculto si el módulo falta. -->
    <section id="lights-panel" class="lights-panel glass" role="dialog" aria-modal="true" aria-labelledby="lights-title" hidden>
      <p class="panel-kicker lights-kicker"><img class="lights-mark" src="assets/logos/lights.svg" alt="" draggable="false">Luces · WiZ</p>
      <h2 id="lights-title" class="lights-title">Living</h2>
      <p class="lights-summary"></p>
      <div class="lights-body">
        <div class="lights-lamps" role="group" aria-labelledby="lights-lamps-label">
          <p id="lights-lamps-label" class="lights-label">Lámparas del living</p>
          <div class="lights-list"></div>
        </div>
        <div class="lights-controls"></div>
      </div>
      <div class="lights-actions">
        <p class="lights-status" role="status" aria-live="polite"></p>
        <button class="ghost-button lights-search" type="button">Buscar lámparas</button>
        <button class="primary-button lights-close" type="button">Cerrar</button>
      </div>
    </section>
  </div>

  <!-- Íconos del clima: formas planas sin filtros, referenciadas con <use xlink:href>. -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <defs>
      <path id="wx-cloud-shape" d="M15 38h19a8 8 0 0 0 1.2-15.9A11 11 0 0 0 14.3 24 7 7 0 0 0 15 38z"/>
      <g id="wx-sun-rays" fill="none" stroke="#ffd36e" stroke-width="3" stroke-linecap="round">
        <path d="M24 4.5v4M24 39.5v4M4.5 24h4M39.5 24h4M10.2 10.2l2.8 2.8M35 35l2.8 2.8M10.2 37.8l2.8-2.8M35 13l2.8-2.8"/>
      </g>
    </defs>
    <symbol id="wx-clear-day" viewBox="0 0 48 48">
      <use xlink:href="#wx-sun-rays"/>
      <circle cx="24" cy="24" r="8.5" fill="#ffd36e"/>
    </symbol>
    <symbol id="wx-clear-night" viewBox="0 0 48 48">
      <path d="M29 7.5a17 17 0 1 0 11.5 26.8A14 14 0 0 1 29 7.5z" fill="#e4eaff"/>
    </symbol>
    <symbol id="wx-partly-day" viewBox="0 0 48 48">
      <g transform="translate(-5 -7) scale(.78)"><use xlink:href="#wx-sun-rays"/><circle cx="24" cy="24" r="8.5" fill="#ffd36e"/></g>
      <use xlink:href="#wx-cloud-shape" transform="translate(4 2)" fill="#f2f5ff"/>
    </symbol>
    <symbol id="wx-partly-night" viewBox="0 0 48 48">
      <path d="M19 4a11 11 0 1 0 8.5 18A9 9 0 0 1 19 4z" fill="#e4eaff"/>
      <use xlink:href="#wx-cloud-shape" transform="translate(4 2)" fill="#f2f5ff"/>
    </symbol>
    <symbol id="wx-cloud" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(-6 -6) scale(.8)" fill="#aebbd8"/>
      <use xlink:href="#wx-cloud-shape" transform="translate(3 2)" fill="#f2f5ff"/>
    </symbol>
    <symbol id="wx-fog" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -7)" fill="#dfe6f6"/>
      <path d="M9 37h26M14 43h26" fill="none" stroke="#c4cfe6" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="wx-drizzle" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -8)" fill="#e9eefa"/>
      <path d="M17 36v3M25 36v3M33 36v3M21 42v2M29 42v2" fill="none" stroke="#8fd0ff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="wx-rain" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -8)" fill="#dfe6f6"/>
      <path d="M18 35l-2.5 7M26 35l-2.5 7M34 35l-2.5 7" fill="none" stroke="#6fc0ff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="wx-snow" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -8)" fill="#e9eefa"/>
      <g fill="#ffffff"><circle cx="17" cy="37" r="2.2"/><circle cx="25" cy="40" r="2.2"/><circle cx="33" cy="37" r="2.2"/><circle cx="21" cy="44" r="2"/><circle cx="29" cy="44" r="2"/></g>
    </symbol>
    <symbol id="wx-storm" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -9)" fill="#b9c3da"/>
      <path d="M26 28l-6 9.5h5.2L22 46l9.5-11.5h-5.2L30 28z" fill="#ffd36e"/>
    </symbol>
    <symbol id="wx-unknown" viewBox="0 0 48 48">
      <use xlink:href="#wx-cloud-shape" transform="translate(0 -3)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3.5" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <script src="config.js"></script>
  <script src="wallpapers.js"></script>
  <script src="weather-config.js"></script>
  <script src="daily-photos-config.js"></script>
  <script src="transitions-config.js"></script>
  <script src="lights-config.js"></script>
  <script src="bridge.js"></script>
  <script src="app-catalog.js"></script>
  <script src="apps-manager.js"></script>
  <script src="dock-scroll.js"></script>
  <script src="weather.js"></script>
  <script src="backgrounds.js"></script>
  <script src="daily-photos.js"></script>
  <script src="transitions.js"></script>
  <script src="ambient-wallpaper.js"></script>
  <script src="lights-client.js"></script>
  <script src="lights-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
