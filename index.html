<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <title>Mi pantalla</title>
  <link rel="preload" href="assets/wallpaper.svg" as="image">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="apps-manager.css">
  <link rel="stylesheet" href="lights-panel.css">
</head>
<body>
  <div class="stage">
    <div class="wallpaper" aria-hidden="true">
      <img class="wallpaper-layer" alt="" draggable="false">
      <img class="wallpaper-layer" alt="" draggable="false">
    </div>
    <div class="aura" aria-hidden="true"></div>
    <div class="aura" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <div class="top-start clock">
          <time id="clock" class="clock-time" aria-label="Hora local"></time>
          <span id="date" class="clock-date"></span>
          <span class="preview-label" hidden>Vista previa local</span>
        </div>
        <div class="top-end">
          <div id="weather" class="glass weather" role="group" aria-label="Consultando el clima" data-state="loading">
            <img class="weather-icon" src="assets/weather/desconocido.svg" alt="" draggable="false">
            <span class="weather-temp" aria-hidden="true">–</span>
            <span class="weather-info" aria-hidden="true">
              <span class="weather-condition">Clima</span>
              <span class="weather-range" hidden></span>
              <span class="weather-meta">Consultando…</span>
            </span>
          </div>
          <div class="top-actions">
            <button id="edit-button" class="glass action-button" type="button" aria-label="Personalizar">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h9M19 7h1M4 17h3M13 17h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="16" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2"/>
                <circle cx="10" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2"/>
              </svg>
              <span class="action-label">Personalizar</span>
            </button>
            <button id="lights-button" class="glass action-button lights-button" type="button" aria-label="Luces" hidden>
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a6.5 6.5 0 0 0-3.8 11.8c.6.4.8 1 .8 1.7V17h6v-.5c0-.7.2-1.3.8-1.7A6.5 6.5 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                <path d="M9.5 20.5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <span class="action-label">Luces</span>
            </button>
            <button id="wallpaper-button" class="glass action-button" type="button" aria-label="Solo fondo" aria-pressed="false" title="OK o Atrás para volver al inicio">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/>
                <circle cx="9" cy="10" r="1.8" fill="none" stroke="currentColor" stroke-width="2.2"/>
                <path d="M4 18l5.5-5 4 3.5 2.5-2.5 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="action-label">Fondo</span>
            </button>
          </div>
        </div>
      </header>

      <main class="home">
        <section class="dock" aria-label="Tus aplicaciones y entradas">
          <div class="dock-apps glass shelf">
            <div class="dock-frost" aria-hidden="true">
              <canvas class="frost-layer"></canvas>
              <canvas class="frost-layer"></canvas>
            </div>
            <h2 id="apps-heading" class="shelf-title">Apps</h2>
            <div id="apps-grid" class="tiles-row" aria-labelledby="apps-heading"></div>
            <p id="empty-state" class="empty-state" hidden>
              No hay apps visibles. Elegí cuáles mostrar en Personalizar.
            </p>
          </div>
          <span class="dock-divider" aria-hidden="true"></span>
          <div class="dock-inputs glass shelf">
            <div class="dock-frost" aria-hidden="true">
              <canvas class="frost-layer"></canvas>
              <canvas class="frost-layer"></canvas>
            </div>
            <h2 id="inputs-heading" class="shelf-title">Entradas</h2>
            <div id="inputs-grid" class="tiles-row" aria-labelledby="inputs-heading"></div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-info">
          <p id="status" role="status" aria-live="polite"></p>
          <p id="weather-status" class="weather-status" data-state="loading"></p>
        </div>
        <p id="photo-credit" class="photo-credit" hidden></p>
      </footer>
    </div>

    <div class="scrim" aria-hidden="true"></div>
    <section id="manage-panel" class="manage-panel glass glass-strong" role="dialog" aria-modal="true" aria-labelledby="manage-title" hidden>
      <h2 id="manage-title">Personalizar</h2>
      <p class="manage-description">Elegí qué apps ver en el dock y en qué orden.</p>
      <div id="manage-list" class="manage-list"></div>
      <div id="sources-view" class="sources-view" hidden></div>
      <div class="manage-actions">
        <button id="reset-button" class="ghost-button" type="button">Restablecer</button>
        <button id="sources-button" class="ghost-button" type="button">Fuentes</button>
        <button id="done-button" class="primary-button" type="button">Listo</button>
      </div>
    </section>
    <!-- Luces WiZ: lights-panel.js completa la lista y los controles; queda oculto si el módulo falta. -->
    <section id="lights-panel" class="lights-panel glass" role="dialog" aria-modal="true" aria-labelledby="lights-title" hidden>
      <h2 id="lights-title" class="lights-title">Luces</h2>
      <p class="lights-summary"></p>
      <div class="lights-body">
        <div class="lights-lamps" role="group" aria-labelledby="lights-lamps-label">
          <p id="lights-lamps-label" class="lights-label">Tus lámparas</p>
          <div class="lights-list"></div>
        </div>
        <div class="lights-controls"></div>
      </div>
      <div class="lights-actions">
        <p class="lights-status" role="status" aria-live="polite"></p>
        <button class="ghost-button lights-search" type="button">Buscar lámparas</button>
        <button class="primary-button lights-close" type="button">Cerrar</button>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="wallpapers.js"></script>
  <script src="weather-config.js"></script>
  <script src="daily-photos-config.js"></script>
  <script src="transitions-config.js"></script>
  <script src="lights-config.js"></script>
  <script src="bridge.js"></script>
  <script src="app-catalog.js"></script>
  <script src="apps-manager.js"></script>
  <script src="dock-scroll.js"></script>
  <script src="wallpaper-mode.js"></script>
  <script src="weather.js"></script>
  <script src="backgrounds.js"></script>
  <script src="daily-photos.js"></script>
  <script src="transitions.js"></script>
  <script src="ambient-wallpaper.js"></script>
  <script src="lights-client.js"></script>
  <script src="lights-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
